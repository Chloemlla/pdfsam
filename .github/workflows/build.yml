name: build

# Multi-platform build and GitHub Release for this fork, on the same three
# triggers as the release pipeline this workflow replicates:
#
#  - push a tag like `v6.0.7` -> builds every platform and attaches the packages
#    to the GitHub Release for that tag;
#  - push to `master`         -> real-time multi-platform build, and when all of
#    them succeed the packages are published straight away as the official
#    release of the version declared in `pdfsam-basic/pom.xml`: tagged
#    `v<version>`, named after that version and marked "Latest". A second push
#    without a version bump updates that same release (assets are overwritten),
#    so "Latest" always points at the newest successful build of `master`.
#    Note that `master` declares a `-SNAPSHOT` version, so until it is bumped the
#    auto release tag carries that suffix (`v6.0.7-SNAPSHOT`).
#  - run manually (workflow_dispatch) -> builds every platform and keeps the
#    packages as downloadable workflow artifacts, without creating a release.
#
# The packages built here are unsigned: signing and notarization need the GPG,
# Apple and Azure Trusted Signing credentials that only live in `release.yml`.
# That is why Windows/macOS code signing and the macOS jpackage/notarize steps
# are skipped explicitly below, and the portable archives are the assets this
# workflow can produce.
on:
  push:
    tags: ["v*"]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # needed to create and update the GitHub Release

jobs:
  check-version:
    name: Check tag version
    runs-on: ubuntu-latest
    # The release tag, the release name and the commit list are computed once
    # here and handed to every job that publishes, so all platforms release the
    # very same thing.
    outputs:
      version: ${{ steps.project.outputs.version }}
      changelog: ${{ steps.commits.outputs.changelog }}
      tag: ${{ steps.project.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # The commit list below walks the history back to the previous tag, so
        # this clone cannot be shallow.
        fetch-depth: 0

    # The version lives in the `pdfsam-basic` module, inherited from the root
    # pom. An already pushed tag is what will be released, otherwise the version
    # is released as `v<version>`.
    - name: Read the project version
      id: project
      shell: bash
      run: |
        set -eu
        VERSION="$(sed -n '/<artifactId>pdfsam-parent<\/artifactId>/,/<\/parent>/ s/.*<version>\(.*\)<\/version>.*/\1/p' pdfsam-basic/pom.xml | head -n 1)"
        [ -n "$VERSION" ] || { echo "could not read the project version"; exit 1; }
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
        fi

    # Every release body lists the commits it was built from: a tag lists
    # everything since the previous tag, a branch push everything the push
    # brought in, a manual run the newest commits of the checked out revision.
    - name: Collect commits
      id: commits
      shell: bash
      env:
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
      run: |
        set -eu
        RANGE=""
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          # `git describe` on the parent skips the tag being released itself.
          PREVIOUS="$(git describe --tags --abbrev=0 "${AFTER}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ] && git merge-base --is-ancestor "$PREVIOUS" "$AFTER"; then
            RANGE="${PREVIOUS}..${AFTER}"
          fi
        fi
        if [ -z "$RANGE" ] && [ -n "${BEFORE:-}" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
          RANGE="${BEFORE}..${AFTER}"
        fi
        if [ -z "$RANGE" ]; then
          # No usable range: first tag of the repository, or a force push that
          # orphaned the previous head. Fall back to the newest commits.
          BASE="$(git rev-parse "${AFTER}~50" 2>/dev/null || true)"
          if [ -n "$BASE" ]; then RANGE="${BASE}..${AFTER}"; else RANGE="$AFTER"; fi
        fi
        COUNT="$(git rev-list --count "$RANGE")"
        {
          echo "changelog<<CHANGELOG_EOF"
          echo "### 本次构建包含的提交（共 ${COUNT} 条）"
          echo
          git log --max-count=200 --pretty=format:'- %s (`%h`)' "$RANGE"
          if [ "$COUNT" -gt 200 ]; then
            echo
            echo
            echo "（提交较多，仅列出最近 200 条）"
          fi
          echo
          echo "CHANGELOG_EOF"
        } >> "$GITHUB_OUTPUT"

    # A fork tag may carry a suffix after the version so the same revision can be
    # released more than once: v6.0.7, v6.0.7-zh.1, ...
    - name: Ensure tag matches the project version
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -eu
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        ROOT_VERSION="$(sed -n '/<artifactId>pdfsam-parent<\/artifactId>/,/<\/version>/ s/.*<version>\(.*\)<\/version>.*/\1/p' pom.xml | head -n 1)"
        APP_VERSION="${{ steps.project.outputs.version }}"
        [ -n "$ROOT_VERSION" ] || { echo "could not read the version from pom.xml"; exit 1; }
        [ -n "$APP_VERSION" ] || { echo "could not read the version from pdfsam-basic/pom.xml"; exit 1; }
        if [ "$ROOT_VERSION" != "$APP_VERSION" ]; then
          echo "pdfsam-basic/pom.xml inherits ${APP_VERSION}, but pom.xml declares ${ROOT_VERSION}."
          echo "Align the module version before tagging."
          exit 1
        fi
        case "$TAG_VERSION" in
          "$ROOT_VERSION"|"$ROOT_VERSION"-*) ;;
          *)
            echo "Tag ${GITHUB_REF_NAME} does not start with the project version ${ROOT_VERSION}."
            echo "Use v${ROOT_VERSION} or v${ROOT_VERSION}-<suffix>."
            exit 1
            ;;
        esac

  build:
    runs-on: ${{ matrix.os }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, macos-15-intel, windows-latest ]
        # Temporary pin: setup-java resolves Liberica 25 to 25.0.5+11, ignoring 25.0.5.0.3+5 that fixes CVE-2026-114820
        include:
          - os: macos-latest
            jdk_file: bellsoft-jdk25.0.5.0.3+5-macos-aarch64-full.tar.gz
            jdk_sha1: 70ee0d4cb5010eb666a05de3adaef16da7fb0041
          - os: macos-15-intel
            jdk_file: bellsoft-jdk25.0.5.0.3+5-macos-amd64-full.tar.gz
            jdk_sha1: 1d95b242496c7861b2d8dac845ca335b140fd552
          - os: ubuntu-latest
            jdk_file: bellsoft-jdk25.0.5.0.3+5-linux-amd64-full.tar.gz
            jdk_sha1: bbb9da2585b2cd294502912513a0753eaf261701
          - os: windows-latest
            jdk_file: bellsoft-jdk25.0.5.0.3+5-windows-amd64-full.zip
            jdk_sha1: a286e459eb9c27aa44bff4484125c51255e922ab
    name: build ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Download JDK
      shell: bash
      env:
        JDK_FILE: ${{ matrix.jdk_file }}
        JDK_SHA1: ${{ matrix.jdk_sha1 }}
      working-directory: ${{ runner.temp }}
      run: |
        curl -fsSL -o "$JDK_FILE" "https://github.com/bell-sw/Liberica/releases/download/25.0.5.0.3+5/$JDK_FILE"
        SHA1_CMD=$(command -v sha1sum || echo "shasum -a 1")
        echo "$JDK_SHA1  $JDK_FILE" | $SHA1_CMD -c -
    - name: Set up JDK
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'jdkfile'
        jdk-file: ${{ runner.temp }}/${{ matrix.jdk_file }}
        java-version: '25.0.5'
        architecture: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x64' }}
        cache: 'maven'
    - name: Print Java version
      run: java -version
    - name: Install gettext on Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y gettext

    - name: Build with Maven Ubuntu
      if: matrix.os == 'ubuntu-latest'
      run: xvfb-run mvn -Djava.awt.headless=true -Dtestfx.robot=glass -Dtestfx.headless=true -Dprism.order=sw -Dsurefire.rerunFailingTestsCount=2 --batch-mode --update-snapshots verify

    - name: Build with Maven MacOS intel
      if: matrix.os == 'macos-15-intel'
      run: mvn --batch-mode --update-snapshots -DskipTests verify

    - name: Install scoop on Windows
      if: matrix.os == 'windows-latest'
      uses: MinoruSekine/setup-scoop@371e1c778465fed5ee2101c415bead47553e1a07 # v5.0.0

    - name: Install gettext on Windows
      if: matrix.os == 'windows-latest'
      run: scoop install gettext

    # bash keeps the -D properties intact: the default PowerShell shell on Windows
    # splits arguments on the dot ("-Dsurefire.rerunFailingTestsCount=2" is passed
    # as "-Dsurefire .rerunFailingTestsCount=2"), and Maven then fails with
    # "Unknown lifecycle phase ".rerunFailingTestsCount=2"".
    #
    # The suite carries a number of timing dependent tests (JavaFX/TestFX waits,
    # assertions on work handed to a virtual thread), so a loaded runner can make
    # an otherwise green test fail. Two retries keep the release pipeline from
    # being blocked by that without hiding a real failure: a deterministic one
    # fails all three attempts and still breaks the build. The summary reports
    # whatever had to be retried as "Flakes".
    - name: Build with Maven
      if: matrix.os != 'ubuntu-latest' && matrix.os != 'macos-15-intel'
      shell: bash
      run: mvn --batch-mode --update-snapshots -Dsurefire.rerunFailingTestsCount=2 verify

    # Package the platform release output (portable zip/tar.gz, deb) so it can be
    # published. `-Drelease` enables the platform packaging profiles and the build
    # stops at `package`: code sign and notarize steps live in the
    # integration-test phases and are only wired up in release.yml. For the same reason
    # the Windows and mac code signing is skipped here, their portable archives are the
    # assets CI can produce.
    - name: Package release artifacts
      # bash keeps the -D properties intact: the default PowerShell shell on Windows
      # splits arguments on the dot ("-Dgpg.skip=true" is passed as "-Dgpg .skip=true")
      shell: bash
      run: mvn --batch-mode --update-snapshots -DskipTests -Drelease "-Dgpg.skip=true" "-Dmaven.javadoc.skip=true" "-Dwin.sign.skip=true" "-Dmac.jpackage.skip=true" package

    # Collect whatever this platform produced into dist/, so that one file list
    # feeds both the workflow artifact and (on a tag) the GitHub Release. The
    # artifact names already carry the project version and the platform
    # classifier, so nothing has to be relabelled afterwards.
    - name: Collect platform packages
      shell: bash
      run: |
        set -eu
        shopt -s nullglob
        rm -rf dist
        mkdir -p dist
        found=0
        for file in pdfsam-basic/target/*.zip pdfsam-basic/target/*.tar.gz \
                    pdfsam-basic/target/*.deb pdfsam-basic/target/*.msi \
                    pdfsam-basic/target/*.msix pdfsam-basic/target/*.dmg; do
          cp "$file" dist/
          found=$((found + 1))
        done
        if [ "$found" -eq 0 ]; then
          echo "no package was produced on ${{ matrix.os }}" >&2
          exit 1
        fi
        echo "Packaged artifacts:"
        ls -lh dist

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pdfsam-basic-${{ matrix.os }}
        if-no-files-found: error
        path: dist/*

    # A tag push is the official release of that build, so every platform job
    # attaches its own packages to the same release: whoever finishes first
    # creates it (the action updates an already existing tag instead of failing),
    # the others just add their assets. The body is identical in every platform
    # job, so the concurrent updates cannot disagree.
    - name: Attach to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        files: dist/*
        fail_on_unmatched_files: true
        draft: false
        # A fork tag is the official release of that build, so it is never a
        # prerelease and is allowed to take over the "Latest" badge.
        prerelease: false
        make_latest: true
        name: "PDFsam Basic ${{ needs.check-version.outputs.version }}"
        body: |
          PDFsam Basic ${{ needs.check-version.outputs.version }}（多平台自动构建，未签名）。

          - 构建提交：`${{ github.sha }}`
          - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 安装包见下方 Assets（Windows / macOS / Linux，x86_64 与 aarch64）

          ${{ needs.check-version.outputs.changelog }}

  # Publishing step for real-time builds on `master`: collect every platform
  # package and publish them immediately as the official release of the version
  # currently declared in `pdfsam-basic/pom.xml` - tag `v<version>`, marked
  # "Latest", neither a draft nor a prerelease. Re-running it for the same version
  # updates that same release and overwrites its assets, which keeps "Latest" on
  # the newest successful `master` build. Tag pushes keep their own release path,
  # and manual dispatches stay artifact-only.
  publish-release:
    name: publish-release
    needs: [check-version, build]
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Merge every platform artifact into a single directory; the per platform
    # file names carry a distinct classifier, so this cannot collide.
    - name: Download all build artifacts
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        path: release-assets
        merge-multiple: true

    - name: List release assets
      shell: bash
      run: |
        set -eu
        ls -lh release-assets

    - name: Publish release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ needs.check-version.outputs.tag }}
        # Creates the `v<version>` tag on the very commit that was built, even if
        # `master` has moved on while the builds were running.
        target_commitish: ${{ github.sha }}
        name: "PDFsam Basic ${{ needs.check-version.outputs.version }}"
        body: |
          PDFsam Basic ${{ needs.check-version.outputs.version }} 正式版（多平台自动构建，未签名）。

          - 构建提交：`${{ github.sha }}`
          - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 安装包见下方 Assets（Windows / macOS / Linux，x86_64 与 aarch64）

          同一版本号再次构建会覆盖更新本 Release 的 Assets，"Latest" 始终指向 master 上最新一次成功的构建。

          ${{ needs.check-version.outputs.changelog }}
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: release-assets/*
